<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Glam Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f7f2f8;
}

/* NAVBAR INCLUIDA DESDE navbar.html */

/* CONTENEDOR */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:90vh;
}

/* FORMULARIO */
.form-box{
    background:rgba(255,255,255,0.85);
    padding:40px;
    border-radius:15px;
    width:350px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.form-box h2{
    color:#5c3d75;
    margin-bottom:10px;
}

.form-box p{
    color:#8a7f95;
    font-size:14px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
}

input:focus{
    border-color:#caa6d9;
}

/* BOTÓN */
.btn{
    width:100%;
    padding:12px;
    background:#f4a6c0;
    border:none;
    border-radius:25px;
    color:white;
    font-weight:500;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.btn:hover{
    background:#ec8fb0;
}

</style>
</head>
<body>

<!-- NAVBAR -->
{% include 'navbar.html' %}

<!-- FORMULARIO -->
<div class="container">
    <div class="form-box">
        <h2>Crear Cuenta</h2>
        <p>Regístrate para vivir la experiencia Glam</p>

        <form action="{{ url_for('registro') }}" method="POST" novalidate>
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <input type="text" name="telefono" placeholder="Teléfono" required>

            <button type="submit" class="btn">Registrarme</button>
        </form>
    </div>
</div>

</body>
</html>
