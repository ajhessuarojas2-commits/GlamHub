<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ver Usuario | Glam Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f7f2f8;
}

.container{
    width:90%;
    max-width:600px;
    margin:60px auto;
}

.card{
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(92,61,117,.12);
}

h1{
    color:#5c3d75;
    margin-bottom:25px;
}

.info{
    padding:15px;
    background:#faf7fc;
    border-radius:12px;
    margin-bottom:12px;
}

.info strong{
    color:#5c3d75;
}

.info span{
    color:#7a6d85;
}

.buttons{
    margin-top:25px;
    display:flex;
    gap:10px;
}

a{
    text-decoration:none;
    padding:11px 20px;
    border-radius:20px;
    background:#caa6d9;
    color:white;
}

.edit{
    background:#f4a6c0;
}

</style>

</head>

<body>

{% include 'navbar.html' %}

<div class="container">

<div class="card">

<h1>👤 Información del usuario</h1>

<div class="info">
<strong>ID:</strong>
<span>{{ usuario.IdUsuario }}</span>
</div>

<div class="info">
<strong>Nombre:</strong>
<span>{{ usuario.NombreUsuario }}</span>
</div>

<div class="info">
<strong>Correo:</strong>
<span>{{ usuario.CorreoUsuario }}</span>
</div>

<div class="info">
<strong>Teléfono:</strong>
<span>{{ usuario.TelefonoUsuario }}</span>
</div>

<div class="buttons">

<a href="{{ url_for('usuarios') }}">
    ← Volver
</a>

<a
    class="edit"
    href="{{ url_for('editar_usuario', id=usuario.IdUsuario) }}">
    ✏️ Editar
</a>

</div>

</div>

</div>

</body>

</html>
```
