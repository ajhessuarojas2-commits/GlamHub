<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glam Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f7f2f8;
}

/* NAVBAR INCLUIDA DESDE navbar.html */

/* HERO */
.hero{
    height:85vh;
    background:url('https://images.unsplash.com/photo-1522337360788-8b13dee7a37e') no-repeat center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.overlay{
    background:rgba(255,255,255,0.7);
    position:absolute;
    width:100%;
    height:100%;
}

.hero-content{
    position:relative;
    text-align:center;
}

.hero-content h1{
    font-size:50px;
    color:#5c3d75;
}

.hero-content span{
    color:#b497c9;
}

.hero-content p{
    margin-top:10px;
    color:#7a6d85;
    font-size:18px;
}

/* BOTÓN PRINCIPAL */
.btn-main{
    margin-top:25px;
    background:#f4a6c0;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
}

.btn-main:hover{
    background:#ec8fb0;
}

</style>
</head>
<body>

<!-- NAVBAR -->
{% include 'navbar.html' %}

<!-- HERO -->
<section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
        <h1>Bienvenida a <span>Glam Hub</span></h1>
        <p>Donde tu belleza cobra vida con un toque de magia</p>
        <button class="btn-main">Agenda tu Transformación</button>
    </div>
</section>

</body>
</html>
